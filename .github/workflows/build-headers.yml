name: Build Armbian Headers for NanoPC-T3+

on:
  workflow_dispatch:

jobs:
  build-headers:
    runs-on: ubuntu-latest

    steps:
      # ---------- 1. 磁盘清理 ----------
      - name: Free up disk space
        run: |
          echo "===== Disk before cleanup ====="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/share/java
          sudo apt-get clean
          echo "===== Disk after cleanup ====="
          df -h

      # ---------- 2. 安装依赖 & QEMU ----------
      - name: Install dependencies and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex libssl-dev make libncurses-dev \
            python3 python3-pip device-tree-compiler rsync kmod cpio sudo \
            qemu-user-static binfmt-support

      # ---------- 3. 注册 QEMU binfmt ----------
      - name: Enable QEMU binfmt
        run: |
          sudo systemctl restart systemd-binfmt || true
          sudo update-binfmts --enable qemu-aarch64 || true
          sudo update-binfmts --enable qemu-arm || true
          ls /proc/sys/fs/binfmt_misc/ | grep qemu || echo "No qemu binfmt found, continuing anyway"
          echo "Testing arm64 emulation:"
          echo 'int main(){return 0;}' > /tmp/test.c
          aarch64-linux-gnu-gcc /tmp/test.c -o /tmp/test-arm64 2>/dev/null || echo "cross gcc not found, but qemu may still work"
          /tmp/test-arm64 && echo "arm64 emulation OK" || echo "arm64 emulation FAIL"

      # ---------- 4. 创建非 root 用户并加入 docker 组 ----------
      - name: Create non-root user with docker access
        run: |
          sudo useradd -m -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/builder
          sudo chmod 0440 /etc/sudoers.d/builder
          sudo groupadd -f docker
          sudo usermod -aG docker builder
          sudo systemctl restart docker || sudo service docker restart || true
          sleep 5
          sudo -u builder -H bash -c 'docker info > /dev/null 2>&1 && echo "Docker OK for builder" || echo "Docker still not accessible"'

      # ---------- 5. 克隆 Armbian 构建框架 ----------
      - name: Clone Armbian build framework
        run: |
          sudo -u builder -H bash -c '
            cd /home/builder
            git clone https://github.com/armbian/build.git
            cd build
            git checkout 16d039191
          '

      # ---------- 6. 编译内核头文件（使用新的 kernel 命令）----------
      - name: Build kernel headers only
        run: |
          sudo -u builder -H bash -c '
            cd /home/builder/build
            ./compile.sh kernel \
              BOARD=nanopct3plus \
              BRANCH=edge \
              RELEASE=trixie \
              BUILD_MINIMAL=yes \
              INSTALL_HEADERS=yes \
              USE_OCI_CACHE=yes
          '

      # ---------- 7. 上传头文件产物 ----------
      - name: Upload headers artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-headers-deb
          path: /home/builder/build/output/debs/linux-headers-*.deb
          if-no-files-found: error
