name: Build Armbian Headers for NanoPC-T3+

on:
  workflow_dispatch:

jobs:
  build-headers:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:noble
      options: --privileged

    steps:
      # 1. 释放磁盘空间
      - name: Free up disk space (释放磁盘空间)
        run: |
          echo "===== Disk before cleanup ====="
          df -h
          rm -rf /usr/share/dotnet
          rm -rf /usr/local/lib/android
          rm -rf /opt/ghc
          rm -rf /usr/local/share/boost
          rm -rf /usr/share/swift
          rm -rf /usr/local/share/chromium
          rm -rf /opt/hostedtoolcache
          echo "===== Disk after cleanup ====="
          df -h

      # 2. 安装依赖
      - name: Install dependencies (安装依赖)
        run: |
          apt-get update
          apt-get install -y git bc bison flex libssl-dev make libncurses-dev \
            python3 python3-pip device-tree-compiler rsync kmod cpio

      # 3. 克隆 Armbian 构建框架并锁定 commit
      - name: Clone Armbian build framework (克隆构建框架)
        run: |
          git clone https://github.com/armbian/build.git
          cd build
          git checkout 16d039191

      # 4. 只编译内核头文件（内存充足，恢复多线程）
      - name: Build kernel headers only (编译内核头文件)
        run: |
          cd build
          ./compile.sh \
            BOARD=nanopct3plus \
            BRANCH=edge \
            RELEASE=trixie \
            KERNEL_ONLY=yes \
            KERNEL_CONFIGURE=no \
            INSTALL_HEADERS=yes \
            BUILD_MINIMAL=yes

      # 5. 上传生成的头文件包
      - name: Upload headers artifact (上传头文件)
        uses: actions/upload-artifact@v4
        with:
          name: linux-headers-deb
          path: build/output/debs/linux-headers-*.deb
          if-no-files-found: error
