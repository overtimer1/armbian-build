name: Build Armbian Headers for NanoPC-T3+

on:
  workflow_dispatch:

jobs:
  build-headers:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:noble
      options: --privileged

    steps:
      # 1. 释放磁盘空间
      - name: Free up disk space (释放磁盘空间)
        run: |
          echo "===== Disk before cleanup ====="
          df -h
          rm -rf /usr/share/dotnet
          rm -rf /usr/local/lib/android
          rm -rf /opt/ghc
          rm -rf /usr/local/share/boost
          rm -rf /usr/share/swift
          rm -rf /usr/local/share/chromium
          rm -rf /opt/hostedtoolcache
          echo "===== Disk after cleanup ====="
          df -h

      # 2. 安装依赖
      - name: Install dependencies (安装依赖)
        run: |
          apt-get update
          apt-get install -y git bc bison flex libssl-dev make libncurses-dev \
            python3 python3-pip device-tree-compiler rsync kmod cpio sudo

      # 3. 创建非 root 用户并赋予 sudo 权限
      - name: Create non-root user (创建非 root 用户)
        run: |
          useradd -m -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          chown -R builder:builder /__w 2>/dev/null || true
          echo "User 'builder' created and ready."

      # 4. 切换到非 root 用户克隆 Armbian 构建框架
      - name: Clone Armbian build framework (克隆构建框架)
        run: |
          su - builder -c '
            cd /home/builder
            git clone https://github.com/armbian/build.git
            cd build
            git checkout 16d039191
          '

      # 5. 以非 root 用户编译内核头文件
      - name: Build kernel headers only (编译内核头文件)
        run: |
          su - builder -c '
            cd /home/builder/build
            ./compile.sh \
              BOARD=nanopct3plus \
              BRANCH=edge \
              RELEASE=trixie \
              KERNEL_ONLY=yes \
              KERNEL_CONFIGURE=no \
              INSTALL_HEADERS=yes \
              BUILD_MINIMAL=yes
          '

      # 6. 修正文件权限后上传头文件
      - name: Fix permissions and upload headers artifact (修正权限并上传)
        run: |
          chown -R root:root /home/builder/build/output 2>/dev/null || true
          ls -lh /home/builder/build/output/debs/
        # 注意：上传步骤需要在同一 job 内，但 upload-artifact 无法跨步骤直接引用变量，
        # 所以这里直接把路径写死即可。

      - name: Upload headers artifact (上传头文件)
        uses: actions/upload-artifact@v4
        with:
          name: linux-headers-deb
          path: /home/builder/build/output/debs/linux-headers-*.deb
          if-no-files-found: error
